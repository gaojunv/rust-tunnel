# ========================================
# Rust-Tunnel 客户端配置参考文件
# ========================================
# 配置优先级：命令行参数 > 环境变量 > 配置文件 > 默认值
#
# 环境变量映射：
#   SERVER_ADDR     -> server
#   FORWARDS        -> forwards (逗号分隔)
#   AUTH_TOKEN      -> auth_token
#   TLS             -> tls
#   TLS_SERVER_NAME -> tls_server_name
#   TLS_INSECURE    -> tls_insecure
#   LOG_LEVEL       -> log
#
# 命令行参数：
#   --config                指定配置文件路径
#   --server                服务器地址
#   --forward               转发规则（可多次指定）
#   --auth-token            认证令牌
#   --tls / --no-tls       启用/禁用 TLS 加密
#   --tls-server-name       TLS 服务器名称（SNI）
#   --tls-insecure          接受自签名证书（不安全）
#   --log                   日志级别
# ========================================

# --------------------
# 服务器连接配置
# --------------------

# Rust-Tunnel 服务器地址
# 格式：服务器IP:端口 或 域名:端口
# 必填项
server = "your-server.com:8080"

# --------------------
# TLS 加密配置
# --------------------

# 启用 TLS 加密控制通道
# 必须与服务器配置匹配
# 默认值：true
tls = true

# TLS 服务器名称（SNI，可选）
# 如果服务器证书中的域名与连接地址不同，需要设置此项
# 用于证书验证和服务器名称指示
# tls_server_name = "your-server.com"

# 接受自签名证书（不安全模式）
# 设置为 true 时，客户端将接受任何证书（包括自签名证书）
# 适用于服务器使用自签名证书的场景
# 生产环境建议使用 CA 签发的证书并关闭此选项
# 默认值：true
tls_insecure = true

# --------------------
# 端口转发规则
# --------------------

# 端口转发规则列表
# 格式：REMOTE_PORT:LOCAL_HOST:LOCAL_PORT
#   REMOTE_PORT  - 服务器上暴露的端口
#   LOCAL_HOST   - 本地服务地址（可以是 localhost、127.0.0.1，支持 IPv6）
#   LOCAL_PORT   - 本地服务端口
#
# 示例：
#   - "8080:localhost:80"      将服务器 8080 端口转发到本地 80 端口
#   - "9000:127.0.0.1:3000"   将服务器 9000 端口转发到本地 3000 端口
#   - "8443:::1:443"           IPv6 地址示例，转发到 ::1:443

forwards = [
  "8080:localhost:80",
  "9000:127.0.0.1:3000",
  # "8443:::1:443",           # IPv6 示例
  # "2222:localhost:22",       # SSH 转发
]

# --------------------
# 日志配置
# --------------------

# 日志级别
# 可选值：trace, debug, info, warn, error
# 默认值：info
log = "info"

# --------------------
# 认证配置
# --------------------

# 服务器认证令牌（如果服务器启用了客户端认证则必需）
# 必须与服务器配置中的 client_auth_token 完全匹配
# auth_token = "your_secure_auth_token_here"

# 环境变量：AUTH_TOKEN
# 命令行参数：--auth-token <TOKEN>

# ========================================
# Web 服务转发配置示例
# ========================================
# [web-server]
# server = "tunnel.example.com:8080"
# tls = true
# tls_insecure = true
# forwards = [
#   "80:localhost:80",      # HTTP
#   "443:localhost:443",    # HTTPS
# ]
# log = "info"

# ========================================
# 开发环境配置示例
# ========================================
# [development]
# server = "localhost:8080"
# tls = true
# tls_insecure = true
# forwards = [
#   "3001:localhost:3000",   # Web 开发服务
#   "8081:localhost:8080",   # API 服务
# ]
# log = "debug"

# ========================================
# 多端口转发配置示例
# ========================================
# [multi-service]
# server = "tunnel.yourdomain.com:8080"
# tls = true
# tls_insecure = true
# forwards = [
#   "8080:localhost:80",     # Nginx
#   "9000:localhost:9000",   # PHP-FPM
#   "3307:localhost:3306",   # MySQL
#   "6380:localhost:6379",   # Redis
# ]
# log = "info"

# ========================================
# 无 TLS 兼容模式（不推荐，仅用于测试）
# ========================================
# [no-tls]
# server = "localhost:8080"
# tls = false
# forwards = [
#   "3001:localhost:3000",
# ]
# log = "debug"
