# rust-tunnel client
server = "tunnel.example.com:8080"
password = "your-server-client-token"

# Optional: defaults to system hostname
# name = "home-nas"

# TLS
tls = true
tls_insecure = true    # accept self-signed (TOFU)

log = "info"

# Mesh (optional; unchanged by 2026-07-18 refactor)
# mesh = "home"
# mesh_name = "nas"
# mesh_services = ["db:mysql:localhost:3306"]
