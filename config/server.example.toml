# ========================================
# Rust-Tunnel 服务器配置参考文件
# ========================================
# 配置优先级：命令行参数 > 环境变量 > 配置文件 > 默认值
#
# 环境变量映射：
#   CONTROL_ADDR       -> control_addr
#   API_BIND           -> api_addr
#   ADMIN_PASSWORD     -> admin_password
#   JWT_SECRET         -> jwt_secret
#   CLIENT_AUTH_TOKEN  -> client_auth_token
#   TLS                -> tls
#   TLS_CERT           -> tls_cert
#   TLS_KEY            -> tls_key
#   LOG_LEVEL          -> log
#   DB_PATH            -> db_path
#   CLIENT_DIST_DIR    -> client_dist_dir
#   WIKI_DIST_DIR      -> wiki_dist_dir
#   DNS_ENABLED        -> dns_enabled
#   DNS_BIND           -> dns_bind
#   DNS_TUNNEL_DOMAIN  -> dns_tunnel_domain
#   DNS_MESH_DOMAIN    -> dns_mesh_domain
#   TROJAN_ENABLED     -> trojan_enabled
#   TROJAN_PORT        -> trojan_port
#   TROJAN_PASSWORD    -> trojan_password
#   TROJAN_FALLBACK    -> trojan_fallback
#
# 命令行参数：
#   --config               指定配置文件路径
#   --bind                 控制通道监听地址
#   --api-bind             API/Web 界面监听地址
#   --admin-password       Web 管理密码
#   --jwt-secret           JWT 签名密钥
#   --client-auth-token    客户端认证令牌
#   --tls / --no-tls      启用/禁用 TLS 加密
#   --tls-cert             TLS 证书文件路径
#   --tls-key              TLS 私钥文件路径
#   --log                  日志级别
#   --db-path              SQLite 数据库路径
#   --dns-enabled          启用嵌入式 DNS 服务器
#   --dns-bind             DNS 服务器监听地址
#   --dns-tunnel-domain    Tunnel 域名后缀
#   --dns-mesh-domain      Mesh 域名后缀
#   --ss-enabled           启用 Shadowsocks 代理
#   --ss-port              Shadowsocks 监听端口
#   --ss-cipher            Shadowsocks 加密方式
#   --ss-password          Shadowsocks 密码
#   --trojan-enabled       启用 Trojan 代理
#   --trojan-port          Trojan 监听端口
#   --trojan-password      Trojan 密码
#   --trojan-fallback      Trojan 回退地址
# ========================================

# --------------------
# 网络配置
# --------------------

# 控制通道监听地址
# 客户端将连接到此地址进行端口注册和控制通信
# 默认值：0.0.0.0:8080
control_addr = "0.0.0.0:8080"

# API/Web 界面监听地址
# 访问此地址可打开 Web 管理界面和 REST API
# 默认值：0.0.0.0:3000
api_addr = "0.0.0.0:3000"

# --------------------
# TLS 加密配置
# --------------------

# 启用 TLS 加密控制通道
# 启用后，客户端必须使用 TLS 连接
# 默认值：true
tls = true

# TLS 证书文件路径（PEM 格式）
# 如果未设置且 TLS 启用，服务器会自动生成自签名证书
# 默认值：./data/tls/cert.pem
tls_cert = "./data/tls/cert.pem"

# TLS 私钥文件路径（PEM 格式）
# 如果未设置且 TLS 启用，服务器会自动生成私钥
# 默认值：./data/tls/key.pem
tls_key = "./data/tls/key.pem"

# --------------------
# 安全配置
# --------------------

# Web 管理界面管理员密码（可选）
# 如果设置，访问 Web 界面需要登录
# 建议：设置强密码，生产环境必须启用
# admin_password = "your_secure_password_here"

# JWT 签名密钥（可选）
# 用于签署 Web 认证的 JWT Token
# 如果未设置，服务器启动时会自动生成随机密钥
# 建议：生产环境手动设置固定密钥，避免重启后所有用户被登出
# jwt_secret = "your_jwt_secret_key_here_min_32_chars"

# --------------------
# 日志配置
# --------------------

# 日志级别
# 可选值：trace, debug, info, warn, error
# 默认值：info
log = "info"

# --------------------
# 数据库配置
# --------------------

# SQLite 数据库文件路径
# 用于存储：流量统计、客户端连接历史、流量 Buckets
# 默认值：./data/rust-tunnel.db
db_path = "./data/rust-tunnel.db"

# 客户端二进制归档目录
# CI（.github/workflows/release-client.yml）按 tag 落盘为 <dir>/<tag>/，并维护 <dir>/latest 软链
# Web 管理界面「客户端下载」页只读该目录
# 默认值：./client（相对于服务进程工作目录）
client_dist_dir = "./client"

# wiki 桌面端安装包归档目录
# CI（.github/workflows/release-wiki-client.yml）按 wiki-v* tag 落盘为 <dir>/<version>/，
# 并维护 <dir>/latest 软链；Web 下载页的「Wiki 桌面端」分区只读该目录
# 默认值：./wiki（相对于服务进程工作目录）
wiki_dist_dir = "./wiki"

# --------------------
# 客户端认证配置
# --------------------

# 客户端认证令牌（可选但推荐）
# 如果设置了此值，客户端连接时必须提供匹配的认证令牌
# 这可以防止未授权的客户端注册端口转发
# 建议使用高强度的随机字符串
# client_auth_token = "your_secure_auth_token_here"

# 环境变量：CLIENT_AUTH_TOKEN
# 命令行参数：--client-auth-token <TOKEN>

# --------------------
# DNS 服务器配置
# --------------------

# 启用嵌入式 DNS 权威服务器
# 监听 UDP 53 端口，为 *.tunnel.local 和 *.mesh.local 提供域名解析
# 默认值：false（需要 root 权限监听 53 端口）
dns_enabled = false

# DNS 服务器监听地址
# 默认值：0.0.0.0:53
dns_bind = "0.0.0.0:53"

# Tunnel 端口域名后缀
# 客户端注册转发规则时自动注册为 <name>.tunnel.local
# 默认值：tunnel.local
dns_tunnel_domain = "tunnel.local"

# Mesh 服务发现域名后缀
# Mesh 内服务自动注册为 <service>.<mesh-id>.mesh.local
# 默认值：mesh.local
dns_mesh_domain = "mesh.local"

# --------------------
# Trojan 代理配置
# --------------------

# 启用 Trojan 代理服务器
# Trojan 协议需要 TLS 加密，使用独立的 TLS 监听端口
# 默认值：false
trojan_enabled = false

# Trojan 监听端口（启用 Trojan 时必填）
# 客户端将连接此端口进行 TLS 握手和 Trojan 协议通信
# trojan_port = 443

# Trojan 认证密码（启用 Trojan 时必填）
# 客户端使用此密码的 SHA-224 哈希进行认证
# 建议：使用高强度随机字符串
# trojan_password = "your_trojan_password_here"

# Trojan 认证失败时的回退地址
# 当客户端发送的密码哈希不匹配时，流量将被转发到此地址
# 格式：host:port，例如 "127.0.0.1:80" 转发到本地 Web 服务器
# 这使得 Trojan 端口看起来像一个普通的 HTTPS 站点
# trojan_fallback = "127.0.0.1:80"

# ========================================
# 生产环境推荐配置（取消注释使用）
# ========================================
# [production]
# control_addr = "0.0.0.0:8080"
# api_addr = "0.0.0.0:3000"
# tls = true
# tls_cert = "/etc/rust-tunnel/tls/cert.pem"
# tls_key = "/etc/rust-tunnel/tls/key.pem"
# admin_password = "change_this_to_strong_password"
# jwt_secret = "generate_a_random_32_byte_string_here"
# client_auth_token = "your_secure_client_auth_token"
# trojan_enabled = true
# trojan_port = 443
# trojan_password = "your_trojan_password_here"
# trojan_fallback = "127.0.0.1:80"
# dns_enabled = true
# dns_bind = "0.0.0.0:53"
# dns_tunnel_domain = "tunnel.local"
# dns_mesh_domain = "mesh.local"
# log = "warn"
# db_path = "/var/lib/rust-tunnel/rust-tunnel.db"

