[package]
name = "rust-tunnel-client"
# 远程控制数据面 v6（键位码输入 + 脏矩形增量补丁）要求两端同为 ≥ 0.13.0：服务端按
# `CARGO_PKG_VERSION` 上报的版本做门控（`MIN_REMOTE_CLIENT_VERSION`），而 release-client.yml /
# release-client-gui.yml 的 VERSION 只取 git tag、不写回 Cargo.toml —— 这里漏抬会让门控把所有客户端一起挡掉。
# 0.13.1 = 仅 QoS 闭环修正（网络拥塞不再改分辨率），协议仍是 v6，与 0.13.0 可互通。
# 0.14.0 = 数据面 v7（新增锁屏 `SessionMessage::LockScreen`），两端必须同为 0.14.0。
# 0.15.0 = 控制通道自更新（`ClientUpdate*` 变体）；新变体只在服务端确认客户端
# ≥ `MIN_UPDATE_CLIENT_VERSION` 后下发，旧客户端不会因未知 bincode 变体断连。
# 数据面协议仍是 v7，可与 0.14.0 互控。
version = "0.15.0"
edition = "2021"
description = "rust-tunnel client (zero-config intranet penetration)"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[[bin]]
name = "rust-tunnel-client"
path = "src/bin/client.rs"

[features]
default = ["code-outline"]
code-outline = [
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-python",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-go",
]

[dependencies]
rust-tunnel-common = { path = "../common" }
bincode.workspace = true
clap.workspace = true
figment.workspace = true
gethostname.workspace = true
hex.workspace = true
portable-pty.workspace = true
rand.workspace = true
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tree-sitter = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-go = { version = "0.25", optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
