[package]
name = "rust-tunnel-client"
# 远程控制数据面 v6（键位码输入 + 脏矩形增量补丁）要求两端同为 ≥ 0.13.0：服务端按
# `CARGO_PKG_VERSION` 上报的版本做门控（`MIN_REMOTE_CLIENT_VERSION`），而 release-client.yml /
# release-client-gui.yml 的 VERSION 只取 git tag、不写回 Cargo.toml —— 这里漏抬会让门控把所有客户端一起挡掉。
# 0.13.1 = 仅 QoS 闭环修正（网络拥塞不再改分辨率），协议仍是 v6，与 0.13.0 可互通。
# 0.14.0 = 数据面 v7（新增锁屏 `SessionMessage::LockScreen`），两端必须同为 0.14.0。
# 0.15.0 = 控制通道自更新（`ClientUpdate*` 变体）；新变体只在服务端确认客户端
# ≥ `MIN_UPDATE_CLIENT_VERSION` 后下发，旧客户端不会因未知 bincode 变体断连。
# 数据面协议仍是 v7，可与 0.14.0 互控。
# 0.16.0 = 数据面 v8（`HostStats` 遥测 + 心跳时间戳 + 采集时间戳/端到端），两端必须同为 0.16.0。
# 0.17.0 = 数据面 v9（`CursorShape` 远端光标形状跟随），两端必须同为 0.17.0。
# 0.20.0 = 服务端按 `MIN_SERVICE_UPDATE_CLIENT_VERSION = (0,20,0)` 才在更新清单里附带
#          无人值守服务 exe；**这个版本号就是 GUI/实例上报给服务端的值**（`Register`
#          在 client crate 里发），所以必须与 `client-gui` / `win-service` 一起抬。
#          线上协议逐字节不变，0.17.0 ↔ 0.20.0 可互连。
# 0.21.0 = 远程控制延迟修复（补丁模式重设基准、解码队列按参考链截断、DXVA 回读预算、
#          静止保活 250→66 ms）。**数据面仍是 v9、线上帧逐字节不变**，0.20.0 ↔ 0.21.0
#          可互连；但两端都升到 0.21.0 才有完整收益（单端升级只改善该端行为）。
# 0.22.0 = 数据面 v10（`CodecId::H265` + `CodecOffer.h265`）：双方支持时自动优先
#          H.265/HEVC，任一侧缺硬件/系统解码器或建编码器失败时回退 H.264 → VP9。
#          两端必须同为 0.22.0（0.21 ↔ 0.22 在握手阶段被硬相等校验干净拒绝）。
# 0.25.0 = 控制端上屏「放大锐化」（CAS-Y）+ 开关/强度设置。纯显示侧、不上线：
#          数据面仍是 v12、线上帧逐字节不变，0.24.0 ↔ 0.25.0 可互控。
# 0.26.0 = 控制端放大增强新增 FSR1（EASU+RCAS）算法，默认；仍纯显示侧、协议不变，
#          0.25.0 ↔ 0.26.0 可互控。
# 0.27.0 = 频繁切换应用时的画面冻结/延迟尖峰修复（关键帧闸门死锁、QSV 无限 GOP、
#          QoS 严重拥塞一步降档 + 重新操作突发封顶）。数据面仍是 v12、线上帧逐字节
#          不变，0.26.0 ↔ 0.27.0 可互控；`client` / `client-gui` / `win-service` /
#          `win-platform` 必须同版本一起发。
# 0.28.0 = macOS 远程控制对齐（VideoToolbox H.264/H.265 + ScreenCaptureKit 采集/脏矩形
#          补丁/光标 + SCK 音频 + AudioQueue 播放）。纯新增平台实现，数据面仍是 v12、
#          线上帧逐字节不变，0.27.0 ↔ 0.28.0 可互控；四个 crate 同版本一起发。
version = "0.28.0"
edition = "2021"
description = "rust-tunnel client (zero-config intranet penetration)"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[[bin]]
name = "rust-tunnel-client"
path = "src/bin/client.rs"

[features]
default = ["code-outline"]
code-outline = [
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-python",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-go",
]

[dependencies]
rust-tunnel-common = { path = "../common" }
bincode.workspace = true
clap.workspace = true
figment.workspace = true
gethostname.workspace = true
hex.workspace = true
portable-pty.workspace = true
rand.workspace = true
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tree-sitter = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-go = { version = "0.25", optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
