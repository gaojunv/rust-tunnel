[package]
name = "rust-tunnel-mac-video"
version = "0.1.0"
edition = "2021"
description = "macOS 远程控制硬件数据面：VideoToolbox H.264/H.265 编解码 + 像素/变化检测/补丁纯逻辑"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

# 本 crate 在**所有平台**编译：纯逻辑模块（Annex B/颜色/变化检测）不依赖任何
# Apple API，可在 Windows/Linux 上单测；只有 `cfg(target_os = "macos")` 的
# VideoToolbox 模块才引入 objc2 依赖。
[dependencies]
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6"
dispatch2 = "0.3.1"
objc2-core-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-video-toolbox = "0.3.2"
libc = "0.2"
