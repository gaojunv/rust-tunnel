[package]
name = "rust-tunnel-client-gui"
version = "0.8.0"
edition = "2021"
description = "rust-tunnel desktop tray client (winit + tray-icon + eframe)"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[[bin]]
name = "rust-tunnel-client-gui"
path = "src/main.rs"

[dependencies]
rust-tunnel-client = { path = "../client" }
rust-tunnel-common = { path = "../common" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
directories = "5.0"
auto-launch = "0.5"
notify-rust = { version = "4" }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.31"
winit = { version = "0.30", default-features = false, features = ["x11", "wayland"] }
tray-icon = { version = "0.19" }
muda = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
embed-resource = "3"

# keyring 3.x 没有 default feature——不显式选 store 会静默退化成进程内 mock
# （Entry::new/set_password 全返回 Ok，但重启即丢）。按平台声明原生后端。
#
# 注意：以下 [target.*] 段落必须留在文件末尾。Cargo 的段落归属是就近向下的，
# 在它们之后追加的任何依赖都会被 platform 门控，导致其他平台 E0433。
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
