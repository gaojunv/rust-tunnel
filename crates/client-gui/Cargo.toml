[package]
name = "rust-tunnel-client-gui"
# 与 `crates/client` 同步抬版：客户端上报的是 `CARGO_PKG_VERSION`，服务端门控按它判定。见
# `crates/agent/src/runner/version_gate.rs` 的 `MIN_REMOTE_CLIENT_VERSION` 注释。
# 数据面 v3（编解码协商）起要求 ≥ 0.12.0。
version = "0.12.0"
edition = "2021"
description = "rust-tunnel desktop tray client (winit + tray-icon + eframe)"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[[bin]]
name = "rust-tunnel-client-gui"
path = "src/main.rs"

[dependencies]
rust-tunnel-client = { path = "../client" }
rust-tunnel-common = { path = "../common" }
# 远程控制引擎（协议 + 编排，零平台依赖）；平台实现（截屏/注入）在本 crate。
rust-tunnel-remote = { path = "../remote" }
# 实现 `rust_tunnel_remote::transport::TransportEstablisher`（async trait）需要该宏。
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
directories = "5.0"
auto-launch = "0.5"
notify-rust = { version = "4" }
# wgpu 作为 Windows 上 Glow/OpenGL 不可用时的回退（DX12）；默认仍走 Glow。
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wgpu"] }
# 仅用于启动日志里枚举 wgpu adapter（判断是否落到 WARP/软件渲染）；与 eframe
# 的 wgpu feature 共用同一份依赖图。
egui-wgpu = "0.31"
egui = "0.31"
winit = { version = "0.30", default-features = false, features = ["x11", "wayland"] }
tray-icon = { version = "0.19" }
muda = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# 远程控制：截屏与输入注入。两者的平台差异都在各自 crate 内部 cfg 处理，
# 故不需要本文件再按 target 门控（区别于下方的 keyring）。
xcap = "0.9.8"
enigo = "0.6.1"
# 被控端剪贴板同步。arboard 各平台后端由 crate 内部 cfg 处理，无需再门控。
arboard = "3"

# 无 [build-dependencies]：Windows 图标（`build.rs`）直接调 mingw 的 windres，
# 不再走 embed-resource——它的后端按 **host** 选，MSVC host 交叉编 gnu target 时会产出
# MSVC 格式的 .lib 而 mingw 的 ld 读不了。且它的 MSVC 分支对本 crate 本就是死代码：
# GUI 编不出 MSVC 版本（shiguredo_libvpx 的预编译 libvpx 是 mingw 产物）。

# keyring 3.x 没有 default feature——不显式选 store 会静默退化成进程内 mock
# （Entry::new/set_password 全返回 Ok，但重启即丢）。按平台声明原生后端。
#
# 注意：以下 [target.*] 段落必须留在文件末尾。Cargo 的段落归属是就近向下的，
# 在它们之后追加的任何依赖都会被 platform 门控，导致其他平台 E0433。
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# 无头实例（`--instance`）的平台层：安全桌面采集/注入、桌面跟随、虚拟桌面几何归一化。
# 只在 Windows 上编译（macOS/Linux 上本 crate 是零依赖的纯逻辑 crate）。
rust-tunnel-win-platform = { path = "../win-platform" }
# GUI 用户会话的硬件采集（WGC/DXGI）+ NVENC H.264 编码 + Media Foundation 解码。
# 安全桌面的实例模式仍用 win-platform 的 BitBlt，不走这条路径。
rust-tunnel-win-video = { path = "../win-video" }
# `SetProcessDpiAwarenessContext(DPI_AWARENESS_CONTEXT_PER_MONITOR_AWARE_V2)`
# 与主线程 STA 占位（`OleInitialize`，避免 winit 在 MTA 线程上 panic）。
# workspace 的 windows-sys 清单不含这两个，这里按需追加 feature（feature 是叠加的）。
windows-sys = { workspace = true, features = [
    "Win32_UI_HiDpi",
    "Win32_System_Ole",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
