[package]
name = "rust-tunnel-client-gui"
# 与 `crates/client` 同步抬版：客户端上报的是 `CARGO_PKG_VERSION`，服务端门控按它判定。见
# `crates/agent/src/runner/version_gate.rs` 的 `MIN_REMOTE_CLIENT_VERSION` 注释。
# 数据面 v6（键位码输入 + 脏矩形增量补丁）起要求 ≥ 0.13.0；两端必须一起升级
# （v5/v4 ↔ v6 在握手阶段被 `Hello.proto_version` 的硬相等校验干净拒绝）。
# 0.13.1 = 仅 QoS 闭环修正（网络拥塞不再改分辨率），协议仍是 v6，与 0.13.0 可互通。
# 0.14.0 = 数据面 v7（新增锁屏 `SessionMessage::LockScreen`），两端必须同为 0.14.0。
# 0.15.0 = 控制通道自更新（`ClientUpdate*` 变体）；服务端按 `MIN_UPDATE_CLIENT_VERSION`
# 门控，旧客户端不会收到未知变体。数据面协议仍是 v7，可与 0.14.0 互控。
# 0.16.0 = 数据面 v8（`HostStats` 遥测 + 心跳时间戳 + 采集时间戳/端到端），两端必须同为 0.16.0。
# 0.17.0 = 数据面 v9（`CursorShape` 远端光标形状跟随），两端必须同为 0.17.0。
# 0.19.0 = 仅 GUI 外观现代化（Win11 Fluent：左侧导航、卡片、趋势线、日志过滤）。
#          控制通道与数据面协议均未改动，可与 0.18.x 客户端互连。
# 0.20.0 = 自更新同时更新 Windows 无人值守服务（服务端按
#          `MIN_SERVICE_UPDATE_CLIENT_VERSION = (0,20,0)` 才在清单里附带服务 exe）。
#          线上协议逐字节不变，0.19.x ↔ 0.20.0 可互连；`client`（Register 上报的就是
#          它的版本）/ `win-service` / `win-platform` 必须同版本一起发。
# 0.21.0 = 远程控制延迟修复（补丁模式在关键帧请求时「重设基准」而不是退出；控制器解码
#          队列按参考链截断、闸门改在 IDR 入队时打开；DXVA 回读改有界等待；静止保活
#          250→66 ms）。数据面仍是 v9、线上帧逐字节不变，0.20.0 ↔ 0.21.0 可互连。
# 0.22.0 = 数据面 v10（`CodecId::H265` + `CodecOffer.h265`）：新增 H.265/HEVC 硬件编解码
#          与自动协商（H.265 → H.264 → VP9），并新增设置开关 `remote_prefer_h265`
#          （默认开）与实例 `host.toml` 的 `prefer_h265`。两端必须同为 0.22.0；
#          `client` / `win-platform` / `win-service` 同步抬版。
# 0.23.0 = 数据面 v11（音频转发：`Lane::Audio` + `AudioStatus`/`AudioPacket`/
#          `SetAudioEnabled`）：被控端系统声音经 Opus 96 kbps 送到控制端播放。
#          新增 `crates/win-audio`（Windows-only，vendored libopus）与设置/工具条
#          音频控制、实例 `host.toml` 的 `audio`。两端必须同为 0.23.0。
version = "0.24.0"
edition = "2021"
description = "rust-tunnel desktop tray client (winit + tray-icon + eframe)"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[[bin]]
name = "rust-tunnel-client-gui"
path = "src/main.rs"

[dependencies]
rust-tunnel-client = { path = "../client" }
rust-tunnel-common = { path = "../common" }
# 远程控制引擎（协议 + 编排，零平台依赖）；平台实现（截屏/注入）在本 crate。
rust-tunnel-remote = { path = "../remote" }
# 实现 `rust_tunnel_remote::transport::TransportEstablisher`（async trait）需要该宏。
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# 自更新包的 SHA-256 校验（服务端从 SHA256SUMS 下发摘要，客户端校验通过才替换本机程序）。
sha2 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
directories = "5.0"
auto-launch = "0.5"
notify-rust = { version = "4" }
# Windows 默认 wgpu（DX12）——NV12 帧的着色器上屏需要它；Glow 保留为
# `RUST_TUNNEL_RENDERER=glow` 的显式回退。非 Windows 仍默认 Glow。
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wgpu"] }
# NV12 帧的 GPU 上屏（`egui_wgpu::Callback` 的管线/纹理资源）与启动日志里的 adapter
# 枚举（判断是否落到 WARP/软件渲染）；与 eframe 的 wgpu feature 共用同一份依赖图。
egui-wgpu = "0.31"
egui = "0.31"
winit = { version = "0.30", default-features = false, features = ["x11", "wayland"] }
tray-icon = { version = "0.19" }
muda = "0.15"
# 从 eframe 的 `CreationContext` 取出原生窗口句柄（HWND）。托盘线程要靠它把隐藏的
# 主窗口显示出来——隐藏窗口收不到 WM_PAINT，eframe 不再产生帧（见 `tray_worker`）。
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# 远程控制：截屏与输入注入。两者的平台差异都在各自 crate 内部 cfg 处理，
# 故不需要本文件再按 target 门控（区别于下方的 keyring）。
xcap = "0.9.8"
enigo = "0.6.1"
# 被控端剪贴板同步。arboard 各平台后端由 crate 内部 cfg 处理，无需再门控。
arboard = "3"

# 无 [build-dependencies]：Windows 图标（`build.rs`）直接调 mingw 的 windres，
# 不再走 embed-resource——它的后端按 **host** 选，MSVC host 交叉编 gnu target 时会产出
# MSVC 格式的 .lib 而 mingw 的 ld 读不了。且它的 MSVC 分支对本 crate 本就是死代码：
# GUI 编不出 MSVC 版本（shiguredo_libvpx 的预编译 libvpx 是 mingw 产物）。

# keyring 3.x 没有 default feature——不显式选 store 会静默退化成进程内 mock
# （Entry::new/set_password 全返回 Ok，但重启即丢）。按平台声明原生后端。
#
# 注意：以下 [target.*] 段落必须留在文件末尾。Cargo 的段落归属是就近向下的，
# 在它们之后追加的任何依赖都会被 platform 门控，导致其他平台 E0433。

[dev-dependencies]
# 内联 WGSL 的**编译期**校验（`nv12_shader_is_valid_wgsl`）：wgpu 只在运行期建管线时
# 才校验着色器，写错一个重载就是「一开会话就 panic」。naga 与 wgpu 同版本（24），
# 只开 `wgsl-in`（wgpu 本来就会把它编进来，这里不增加实际构建成本）。
naga = { version = "24", default-features = false, features = ["wgsl-in"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# 无头实例（`--instance`）的平台层：安全桌面采集/注入、桌面跟随、虚拟桌面几何归一化。
# 只在 Windows 上编译（macOS/Linux 上本 crate 是零依赖的纯逻辑 crate）。
rust-tunnel-win-platform = { path = "../win-platform" }
# 硬件采集（WGC/DXGI）+ NVENC H.264 编码 + Media Foundation 解码。
# GUI 用户会话直接用；无人值守实例在 Default 桌面上也复用它（零拷贝），
# Winlogon / Screen-saver 等安全桌面仍回退 win-platform 的 GDI BitBlt。
rust-tunnel-win-video = { path = "../win-video" }
# 远程音频数据面：WASAPI loopback 采集 / 播放 + Opus（vendored libopus）。
# 与 win-video 一样只在 Windows 编译，`remote` 不依赖它（引擎只认平台 trait）。
rust-tunnel-win-audio = { path = "../win-audio" }
# `SetProcessDpiAwarenessContext(DPI_AWARENESS_CONTEXT_PER_MONITOR_AWARE_V2)`
# 与主线程 STA 占位（`OleInitialize`，避免 winit 在 MTA 线程上 panic）。
# workspace 的 windows-sys 清单不含这两个，这里按需追加 feature（feature 是叠加的）。
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_HiDpi",
    "Win32_System_Ole",
    # 托盘线程还原隐藏窗口：ShowWindow / SetForegroundWindow / IsWindowVisible，
    # 以及前台锁失败时的 AttachThreadInput（System_Threading）。
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    # `timeBeginPeriod(1)`：把定时器粒度从 15.6 ms 降到 1 ms，避免 MFT/WGC 的
    # 短 sleep 轮询被放大（见 main.rs）。
    "Win32_Media",
    # `LockWorkStation`（协议 v7 的锁屏；见 remote/mod.rs 的 lock_platform_screen）。
    "Win32_System_Shutdown",
    # 读取系统强调色（HKCU\...\DWM\AccentColor；见 ui/accent.rs）。
    "Win32_System_Registry",
] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
