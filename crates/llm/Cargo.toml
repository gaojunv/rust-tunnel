[package]
name = "rust-tunnel-llm"
version = "0.4.0"
edition = "2021"
description = "rust-tunnel LLM gateway (OpenAI/Anthropic/Responses protocol entries, routing, failover, usage)"
license = "MIT"

[lints]
workspace = true

[features]
default = []
rag = ["dep:rust-tunnel-rag"]

[dependencies]
rust-tunnel-common = { path = "../common" }
rust-tunnel-persistence = { path = "../persistence" }
rust-tunnel-rag = { path = "../rag", optional = true }
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
axum.workspace = true
reqwest.workspace = true
futures-util.workspace = true
async-stream.workspace = true
sha2.workspace = true
bytes.workspace = true
rand.workspace = true
hex.workspace = true

[dev-dependencies]
tempfile.workspace = true
