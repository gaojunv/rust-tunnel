[package]
name = "rust-tunnel-server"
version = "0.4.0"
edition = "2021"
description = "rust-tunnel server (intranet penetration, proxy, LLM gateway, agent)"
license = "MIT"
default-run = "rust-tunnel-server"

[lints]
workspace = true

[[bin]]
name = "rust-tunnel-server"
path = "src/bin/server.rs"

[[bin]]
name = "checkdb"
path = "src/bin/checkdb.rs"

[features]
default = []
embed-frontend = ["dep:rust-embed"]
rag = ["dep:rust-tunnel-rag"]

[dependencies]
rust-tunnel-common = { path = "../common" }
rust-tunnel-persistence = { path = "../persistence" }
rust-tunnel-rag = { path = "../rag", optional = true }
tokio.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
bincode.workspace = true
clap.workspace = true
bytes.workspace = true
tokio-util.workspace = true
rand.workspace = true
get_if_addrs.workspace = true
axum.workspace = true
axum-extra.workspace = true
tower-http.workspace = true
async-stream.workspace = true
hyper.workspace = true
hyper-util.workspace = true
hyper-rustls.workspace = true
http-body-util.workspace = true
reqwest.workspace = true
rust-embed = { workspace = true, optional = true }
mime_guess.workspace = true
jsonwebtoken.workspace = true
chrono.workspace = true
serde_json.workspace = true
uuid.workspace = true
sqlx.workspace = true
gethostname.workspace = true
toml.workspace = true
figment.workspace = true
arc-swap.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
tokio-rustls.workspace = true
rcgen.workspace = true
webpki-roots.workspace = true
rustls-native-certs.workspace = true
time.workspace = true
shadowsocks.workspace = true
md-5.workspace = true
lopdf.workspace = true
zip.workspace = true
quick-xml.workspace = true
sha1.workspace = true
sha2.workspace = true
hmac.workspace = true
hex.workspace = true
hickory-proto.workspace = true
async-trait.workspace = true
futures-util.workspace = true
instant-acme.workspace = true
x509-parser.workspace = true
base64.workspace = true
urlencoding.workspace = true
trust-dns-resolver.workspace = true
agent-client-protocol.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tower.workspace = true
tempfile.workspace = true
