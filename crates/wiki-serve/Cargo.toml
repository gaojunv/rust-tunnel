[package]
name = "rust-tunnel-wiki-serve"
version = "0.4.0"
edition = "2021"
description = "Tauri IPC backend for the wiki desktop app"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[lib]
name = "rust_tunnel_wiki_serve"
path = "src/lib.rs"

[[bin]]
name = "wiki-desktop"
path = "src/main.rs"

[features]
default = ["search"]
search = ["rust-tunnel-wiki-core/search"]
tauri = ["dep:tauri", "dep:tauri-build"]

[dependencies]
rust-tunnel-wiki-core = { path = "../wiki-core" }
chrono = { workspace = true }
petgraph = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tauri = { version = "2.11", optional = true }

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dev-dependencies]
tempfile = { workspace = true }
