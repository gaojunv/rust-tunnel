[package]
name = "rust-tunnel-win-service"
# 与 `crates/client-gui` 同一条发布列车（见 `crates/win-platform/Cargo.toml` 的说明）。
# 自更新会把本 exe 与实例 exe 成对换入，两者版本必须一致。
version = "0.24.0"
edition = "2021"
description = "rust-tunnel unattended Windows host: SYSTEM service that launches the client instance into the console session"
license = "MIT OR Apache-2.0"

[[bin]]
name = "rust-tunnel-client-service"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
rust-tunnel-win-platform = { path = "../win-platform" }
tracing.workspace = true
tracing-subscriber.workspace = true
# 自更新路径的安装前复验（`--gui-sha256` / `--self-sha256`）。
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
