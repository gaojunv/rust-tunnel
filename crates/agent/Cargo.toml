[package]
name = "rust-tunnel-agent"
version = "0.4.0"
edition = "2021"
description = "rust-tunnel AI agent workbench (server-side agent loop, ACP bridge, tool execution over tunnel)"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[features]
default = []
rag = ["dep:rust-tunnel-rag", "rust-tunnel-llm/rag"]

[dependencies]
rust-tunnel-common = { path = "../common" }
rust-tunnel-persistence = { path = "../persistence" }
rust-tunnel-llm = { path = "../llm" }
rust-tunnel-rag = { path = "../rag", optional = true }
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
axum.workspace = true
reqwest.workspace = true
futures-util.workspace = true
async-trait.workspace = true
async-stream.workspace = true
agent-client-protocol.workspace = true
sha2.workspace = true
bytes.workspace = true
rand.workspace = true
hex.workspace = true

[dev-dependencies]
tempfile.workspace = true
sqlx.workspace = true
