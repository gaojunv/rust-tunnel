[package]
name = "rust-tunnel-remote"
version = "0.4.0"
edition = "2021"
description = "rust-tunnel remote-control engine: session protocol, screen codec, transport orchestration (pure protocol, no platform/UI deps)"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
rust-tunnel-common = { path = "../common" }
rust-tunnel-rustdesk = { path = "../rustdesk" }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
# `FramedRead::next` / `FramedWrite::send` 需要 StreamExt / SinkExt，故为生产依赖。
futures-util = "0.3"
bytes = "1.0"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
rand = "0.8"
thiserror = "1.0"
async-trait = "0.1"
# 屏幕编码：只开 jpeg，编码/解码走 image 内置 codec，不引入 png/tiff 等无关体积。
image = { version = "0.25", default-features = false, features = ["jpeg"] }
sha2 = "0.10"
hmac = "0.12"
uuid = { version = "1.0", features = ["v4"] }
# 数据面加密：X25519 临时密钥交换 + ChaCha20-Poly1305 AEAD。
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
futures-util = "0.3"
