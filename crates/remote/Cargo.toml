[package]
name = "rust-tunnel-remote"
version = "0.5.0"
edition = "2021"
description = "rust-tunnel remote-control engine: session protocol, screen codec, transport orchestration (pure protocol, no platform/UI deps)"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
rust-tunnel-common = { path = "../common" }
rust-tunnel-rustdesk = { path = "../rustdesk" }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
# `FramedRead::next` / `FramedWrite::send` 需要 StreamExt / SinkExt，故为生产依赖。
futures-util = "0.3"
bytes = "1.0"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
rand = "0.8"
thiserror = "1.0"
async-trait = "0.1"
# VP9 编解码（远程控制数据面）。根 Cargo.toml 的 `[patch.crates-io]` 把它重定向到
# vendor/shiguredo_libvpx —— 上游 2026.1.0 表达不了 profile 1（8-bit 4:4:4）。
# JPEG 编码器（`image` crate）已随瓦片路径一并删除。
shiguredo_libvpx = "2026.1.0"
sha2 = "0.10"
hmac = "0.12"
uuid = { version = "1.0", features = ["v4"] }
# 数据面加密：X25519 临时密钥交换 + ChaCha20-Poly1305 AEAD。
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
# 增量补丁（协议 v6 的 `RegionUpdate`）的无损压缩。只压脏矩形的 NV12，单块通常几 KB；
# level 1 的编码速度远快于采集/编码节拍。`zstd` 在工作区里已由其它 crate 间接引入，
# 此处只是显式依赖，不额外增加 C 构建面。
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
futures-util = "0.3"
# `#[tokio::test(start_paused = true)]` 虚拟时钟（可靠层单测确定性驱动 RTO/重传）。
# test-util 是加法式 feature，不影响生产构建。
tokio = { version = "1.0", features = ["test-util"] }

# `examples/loopback_bench.rs`（本机回环压测）要跑真机那条硬件链路：DXGI 采集 +
# Intel QSV Media Foundation H.264 硬编 + MSH264DecoderMFT/DXVA 解码。`win-video` 不依赖
# `remote`，所以只能作为本 crate 的 **dev-dependency** 引入（生产依赖图不变）。
[target.'cfg(windows)'.dev-dependencies]
rust-tunnel-win-video = { path = "../win-video" }
# 只给压测窗口用（GDI 绘制 + 30 Hz 消息循环 + DPI 感知 + timeBeginPeriod）。
# feature 是叠加的：workspace 清单已含 Foundation/Gdi/WindowsAndMessaging。
windows-sys = { workspace = true, features = [
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_Media",
] }
