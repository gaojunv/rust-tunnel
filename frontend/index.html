<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!-- PWA 全面屏：viewport-fit=cover 让内容延伸到屏幕物理边缘（状态栏/刘海/
         Home 指示条区），是页头贴顶、底部按钮贴底的唯一开关；apple-mobile-web-app-capable
         是老 web-app 模式开关，standalone 生效必需；black-translucent 让状态栏透明、
         内容画到其后面。三者缺一，内容就被限制在系统预留的安全区内、四周露色带。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- theme-color 的 content 不支持 CSS 变量（hsl(var(--background)) 是无效值），
         须写具体 hex：light #f8fafc（= hsl 210 40% 98%），dark #050813（= hsl 224 47% 5%） -->
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#050813" media="(prefers-color-scheme: dark)" />
    <title>Aurora Tunnel Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
