name: Release Client

# 当推送 tag 时触发，也可以手动触发
# 构建矩阵在多 runner 上产出二进制，完成后由 deploy-client 聚合
# 并以版本隔离的方式直传到服务器的 ${DEPLOY_PATH}/client/<tag>/ 目录
# 行为对齐 deploy-direct.yml（SCP 直传，不依赖 Releases/Artifacts 分发）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-client:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: rust-tunnel-client-linux-x86_64
            binary: rust-tunnel-client
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: rust-tunnel-client-macos-x86_64
            binary: rust-tunnel-client
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: rust-tunnel-client-macos-aarch64
            binary: rust-tunnel-client
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: rust-tunnel-client-windows-x86_64
            binary: rust-tunnel-client.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust with target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: true

      - name: Install musl tools (Linux only)
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: musl-tools
          version: 1.0

      - name: Build client
        env:
          RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release -p rust-tunnel-client --target ${{ matrix.target }}

      - name: Strip binary (non-Windows)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/${{ matrix.binary }}

      - name: Upload client binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}

  deploy-client:
    needs: build-client
    runs-on: ubuntu-latest
    # 仅 tag 推送时上传到服务器；手动触发未带 tag 时跳过，避免覆盖
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all client artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./client-dist
          pattern: rust-tunnel-client-*
          merge-multiple: false

      - name: Prepare versioned package
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PKG="pkg/client/${TAG}"
          mkdir -p "${PKG}"
          echo "Packaging version ${TAG} -> ${PKG}"
          for d in client-dist/rust-tunnel-client-*; do
            artifact="$(basename "$d")"
            echo "Processing ${artifact} ..."
            if [[ "${artifact}" == *windows* ]]; then
              if [ -f "${d}/rust-tunnel-client.exe" ]; then
                cp "${d}/rust-tunnel-client.exe" "${PKG}/${artifact}.exe"
              else
                cp "${d}/"* "${PKG}/"
              fi
            else
              if [ -f "${d}/rust-tunnel-client" ]; then
                cp "${d}/rust-tunnel-client" "${PKG}/${artifact}"
              else
                cp "${d}/"* "${PKG}/"
              fi
            fi
          done
          (cd "${PKG}" && sha256sum * > SHA256SUMS)
          echo "--- pkg layout ---"
          ls -lhR pkg
          echo "--- SHA256SUMS ---"
          cat "${PKG}/SHA256SUMS"

      - name: Deploy client to remote server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "pkg/client/${{ github.ref_name }}/*"
          target: ${{ secrets.DEPLOY_PATH }}/client/${{ github.ref_name }}
          strip_components: 3

      - name: Set permissions and update latest symlink
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            BASE="${{ secrets.DEPLOY_PATH }}/client"
            TAG="${{ github.ref_name }}"
            echo "Deployed to ${BASE}/${TAG}:"
            ls -lh "${BASE}/${TAG}/"
            chmod +x "${BASE}/${TAG}/"* || true
            cat "${BASE}/${TAG}/SHA256SUMS" || true
            ln -sfn "${TAG}" "${BASE}/latest"
            ls -ld "${BASE}/latest"
            echo "Client ${TAG} deployed successfully to ${BASE}/${TAG}/ (latest -> ${TAG})"
