name: Release Client

# 当推送 tag 时触发，也可以手动触发
# 构建矩阵在多 runner 上产出二进制后，各 runner 直接 SCP 上传到服务器的
# ${DEPLOY_PATH}/client/<tag>/ 目录（版本隔离），不使用 Artifact 中转，避免存储配额问题
# 全部平台上传完成后由 finalize-client 在服务端生成校验和并更新 latest 软链接
# 行为对齐 release-server.yml（SCP 直传，不依赖 Releases/Artifacts 分发）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 最小权限：仅需 checkout 拉代码；缓存用 runtime token，上传走 SCP/SSH 密钥，均不依赖 GITHUB_TOKEN
permissions:
  contents: read

jobs:
  build-client:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: rust-tunnel-client
            asset: rust-tunnel-client-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: rust-tunnel-client
            asset: rust-tunnel-client-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: rust-tunnel-client
            asset: rust-tunnel-client-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: rust-tunnel-client.exe
            asset: rust-tunnel-client-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust with target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: true

      - name: Install musl tools (Linux only)
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: musl-tools
          version: 1.0

      - name: Build client
        env:
          RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release -p rust-tunnel-client --target ${{ matrix.target }}

      # 无人值守被控端的平台层与服务，有一大批单测**只在 Windows 上编译**
      # （`probe`/`service`/`process`/`host` 全是 `#[cfg(windows)]`），本机 macOS
      # 只能对它们做类型检查。这个 runner 是仓库里唯一能真正跑它们的机器，所以在这里跑：
      # 它们是阶段 0 探针的机械锁（三态判据与报告结论行的逐字匹配、父子进程报告文件名
      # 一致、报价/引号、服务状态映射）。测试失败就该拦住发布。
      - name: Test Windows-only modules
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo test -p rust-tunnel-win-platform -p rust-tunnel-win-service

      - name: Strip binary (non-Windows)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/${{ matrix.binary }}

      # 各平台自行 SCP 直传：appleboy/scp-action 是 Docker action，只能跑在 Linux runner，
      # 因此这里统一用原生 ssh/scp（Windows runner 走 git-bash，自带 OpenSSH 客户端）
      - name: Upload binary to remote server
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.ssh"
          KEY="${HOME}/.ssh/rt_deploy_key"
          printf '%s\n' "${SSH_KEY}" > "${KEY}"
          chmod 600 "${KEY}"
          PORT="${SSH_PORT:-22}"
          DEST="${DEPLOY_PATH}/client/${GITHUB_REF_NAME}"
          SSH_OPTS=(-i "${KEY}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR)
          echo "Uploading ${{ matrix.asset }} -> ${DEST}/"
          ssh "${SSH_OPTS[@]}" -p "${PORT}" "${SSH_USER}@${SSH_HOST}" "mkdir -p '${DEST}'"
          scp "${SSH_OPTS[@]}" -P "${PORT}" \
            "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            "${SSH_USER}@${SSH_HOST}:${DEST}/${{ matrix.asset }}"
          rm -f "${KEY}"

      # 无人值守被控端服务（仅 Windows）：`rust-tunnel-client-service.exe`，
      # 一个把客户端实例拉进控制台会话的 SYSTEM 服务。
      # 它**不依赖 rust-tunnel-remote**（不牵入 libvpx），所以走 MSVC 即可，
      # 不需要 build-gui 那条 leg 的 MSYS2 mingw-w64 曲折；RUSTFLAGS 与上面的
      # `Build client` 一致（静态 CRT，用户机器上不需要额外运行库）。
      # 资产名必须以 `rust-tunnel-client-` 开头：`finalize-client` 的
      # `rust-tunnel-client-*` glob（chmod + sha256sum）与下载页的
      # `platform_from_filename` 都靠它解析平台/架构/扩展名——
      # `rust-tunnel-client-service-windows-x86_64.exe` 会被解析成
      # (windows, x86_64, exe)，与客户端本体同一套规则。
      - name: Build and upload Windows unattended service
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          cargo build --release -p rust-tunnel-win-service --target ${{ matrix.target }}
          # 产物名取自 `crates/win-service/Cargo.toml` 的 `[[bin]] name`；
          # 上传时改名成带平台/架构的资产名（下载页要靠它认平台）。
          SRC="target/${{ matrix.target }}/release/rust-tunnel-client-service.exe"
          ASSET="rust-tunnel-client-service-windows-x86_64.exe"
          # 上传方式与上面 `Upload binary to remote server` 逐字对齐（原生 ssh/scp，
          # 因为 appleboy/scp-action 是 Docker action，只能在 Linux runner 上跑）。
          mkdir -p "${HOME}/.ssh"
          KEY="${HOME}/.ssh/rt_deploy_key"
          printf '%s\n' "${SSH_KEY}" > "${KEY}"
          chmod 600 "${KEY}"
          PORT="${SSH_PORT:-22}"
          DEST="${DEPLOY_PATH}/client/${GITHUB_REF_NAME}"
          SSH_OPTS=(-i "${KEY}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR)
          echo "Uploading ${ASSET} -> ${DEST}/"
          ssh "${SSH_OPTS[@]}" -p "${PORT}" "${SSH_USER}@${SSH_HOST}" "mkdir -p '${DEST}'"
          scp "${SSH_OPTS[@]}" -P "${PORT}" \
            "${SRC}" \
            "${SSH_USER}@${SSH_HOST}:${DEST}/${ASSET}"
          rm -f "${KEY}"

  build-gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: rust-tunnel-client-gui
            asset: rust-tunnel-client-gui-linux-x86_64
          - os: windows-latest
            # shiguredo_libvpx 的预编译 libvpx 是 GNU/mingw-w64 产物（`Built by MSYS2
            # project`、符号 `___chkstk_ms`），MSVC 链不了，故本 leg 走 GNU 工具链。
            # 而且它具体是 **msvcrt 味**的 mingw-w64 构建（依据：它引用 `__imp__setjmp`，
            # 而 `_setjmp` 只存在于 msvcrt 的导入库）——链接器也必须用 msvcrt 味的，
            # 见下面那条 "Use MSVCRT-flavored MinGW" step。
            # 只改 GUI：CLI 客户端（build-client）不依赖 rust-tunnel-remote，保持 msvc。
            target: x86_64-pc-windows-gnu
            binary: rust-tunnel-client-gui.exe
            asset: rust-tunnel-client-gui-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: true
      # 本 leg 的 GNU 链接器必须是 **MSVCRT 味**的 mingw-w64，不能用镜像自带的 `C:\mingw64`。
      #
      # 镜像里的 `C:\mingw64` 是 niXman/mingw-builds 的 **UCRT** 构建（一手来源：runner-images
      # 的 `images/windows/toolsets/toolset-2025.json` 写着 `"mingw": {"version": "15.*",
      # "runtime": "ucrt"}`），而镜像用 `Add-MachinePathItem "C:\mingw64\bin"` 把它放上了
      # PATH——**它本来就排在前面**，所以往 GITHUB_PATH 追加 `C:\msys64\mingw64\bin` 是空操作
      # （原实现正是这么写的，白写了）。
      #
      # 为什么 UCRT 链不了：vendored 的预编译 libvpx 是 **msvcrt 味**的构建，它引用
      # `__imp__setjmp`（mingw-w64 的 `setjmp.h` 把 `setjmp` 宏成 `_setjmp`，声明带 `_CRTIMP`）。
      # 这个导入槽**只有 msvcrt 的导入库提供**：mingw-w64 的 `msvcrt.def.in` 里有
      # `F_NON_ARM64(_setjmp)`，而 `ucrtbase-common.def.in` 里没有（UCRT 只导出 `setjmp` 与
      # `__intrinsic_setjmp`）。于是 UCRT 链接器报 `undefined reference to '__imp__setjmp'`，
      # 且**只**报这一个——libvpx 的其余导入（`__acrt_iob_func`、`_errno`、`longjmp`、
      # `Sleep`/`QueryPerformanceCounter`）两边的导入库都有。
      #
      # MSYS2 的 `mingw64` 环境（包名 `mingw-w64-x86_64-*`）就是 msvcrt 味；UCRT 味是**另一个**
      # 环境 `ucrt64`（`mingw-w64-ucrt-x86_64-*`）。镜像虽预装 MSYS2，但**不装任何 mingw 包**
      # （toolset 里 `MsysPackages.mingw` 是空的），故这里先装上，再前置到 PATH 头部。
      - name: Use MSVCRT-flavored MinGW (MSYS2 mingw64)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: pwsh
        run: |
          & C:\msys64\usr\bin\bash.exe -lc "pacman -Sy --noconfirm --needed mingw-w64-x86_64-gcc"
          if ($LASTEXITCODE -ne 0) { throw "pacman 装 mingw-w64-x86_64-gcc 失败（exit $LASTEXITCODE）" }
          $dir = 'C:\msys64\mingw64\bin'
          if (-not (Test-Path "$dir\x86_64-w64-mingw32-gcc.exe")) {
            throw "MSYS2 的 mingw64 工具链没装上：$dir 下没有 x86_64-w64-mingw32-gcc.exe"
          }
          # 前置而非追加：镜像的 C:\mingw64\bin 已在 PATH 上且排在前，只有前置才赢得过它。
          $lines = @($dir)
          if (Test-Path $env:GITHUB_PATH) { $lines += @(Get-Content $env:GITHUB_PATH) }
          [System.IO.File]::WriteAllLines($env:GITHUB_PATH, [string[]]$lines)
          # 再显式钉住链接器：rustc 直接按绝对路径调它，不吃 PATH 先后的亏。
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=$dir\x86_64-w64-mingw32-gcc.exe" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        # 远程控制新增的构建依赖（xcap 0.9 / enigo 0.6，二者在 Linux 上无条件编译）：
        #   libpipewire-0.3-dev —— pipewire-sys 的 build script 走 system-deps 找 pkg-config
        #   libclang-dev        —— 同一个 build script 用 bindgen 生成绑定
        #   libxcb1-dev / libxcb-randr0-dev —— xcap 的 xcb(randr) 与 enigo 的 x11rb 后端
        #   libgbm-dev          —— libwayshot-xcap（xcap 的 Wayland 后端，无条件编译）依赖
        #                          gbm-sys，**链接期**需要 libgbm.so；缺它会在最后一步链接
        #                          二进制时报 `mold: fatal: library not found: gbm`。
        #                          注意 libgtk-3-dev 不会带出它，必须显式安装。
        # libxkbcommon-dev 是 enigo 的既有依赖，原本已在列表里。
        run: sudo apt-get update && sudo apt-get install -y mold libgtk-3-dev librsvg2-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libpipewire-0.3-dev libclang-dev libxcb1-dev libxcb-randr0-dev libgbm-dev pkg-config libdbus-1-dev libxdo-dev
      - name: Build GUI
        run: cargo build --release -p rust-tunnel-client-gui --target ${{ matrix.target }}
      # 产物必须自足。本 leg 是交叉编译、链接器是 MSYS2 的 mingw-w64——若 gcc 驱动的默认库把
      # `libgcc_s_seh-1.dll` / `libwinpthread-1.dll` 动态带了进来，产物在**用户机器上**起不来
      # （那些 DLL 只存在于 CI 的 `C:\msys64\mingw64\bin`）。本仓此前的 Windows 客户端走 msvc，
      # 是自足的，所以这个风险是换 leg 才引入的，而且**只有这条流水线能验**——本地无 mingw
      # 工具链，交叉编译产物拿不到。
      #
      # 判据：导入表里不得出现任何 `lib*.dll`。mingw 运行时 DLL 全以 `lib` 开头
      # （libgcc_s_seh-1 / libwinpthread-1 / libstdc++-6 / libssp-0），而 Windows 系统 DLL
      # 一个都不是（KERNEL32 / USER32 / GDI32 / D3D11 / DXGI / OPENGL32 / msvcrt …）。
      # 解析不出导入表也算失败——否则判据会被「空列表」静默满足。
      - name: Assert the .exe carries no MinGW runtime DLL imports
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: pwsh
        run: |
          $exe = 'target/x86_64-pc-windows-gnu/release/rust-tunnel-client-gui.exe'
          $objdump = 'C:\msys64\mingw64\bin\objdump.exe'
          if (-not (Test-Path $objdump)) { throw "objdump not found at $objdump (binutils should come with gcc)" }
          $dlls = @(& $objdump -p $exe |
                     Where-Object { $_ -match 'DLL Name:' } |
                     ForEach-Object { ($_ -split 'DLL Name:')[1].Trim() } |
                     Sort-Object -Unique)
          if ($dlls.Count -eq 0) { throw "could not parse the import table of $exe (objdump -p output changed?)" }
          Write-Host 'Imported DLLs:'
          $dlls | ForEach-Object { Write-Host "  $_" }
          $bad = @($dlls | Where-Object { $_ -match '^lib' })
          if ($bad.Count -gt 0) {
            throw "binary depends on MinGW runtime DLLs that users do not have: $($bad -join ', ')"
          }
      - name: Upload GUI to remote
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.ssh"
          KEY="${HOME}/.ssh/rt_deploy_key"
          printf '%s\n' "${SSH_KEY}" > "${KEY}"
          chmod 600 "${KEY}"
          PORT="${SSH_PORT:-22}"
          DEST="${DEPLOY_PATH}/client/${GITHUB_REF_NAME}"
          SSH_OPTS=(-i "${KEY}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR)
          ssh "${SSH_OPTS[@]}" -p "${PORT}" "${SSH_USER}@${SSH_HOST}" "mkdir -p '${DEST}'"
          scp "${SSH_OPTS[@]}" -P "${PORT}" "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${SSH_USER}@${SSH_HOST}:${DEST}/${{ matrix.asset }}"
          rm -f "${KEY}"

  build-gui-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          # 只发 arm64：shiguredo_libvpx 没有 macos_x86_64 预编译，其 build.rs 对该
          # target 直接 panic（`unsupported target: os=macos, arch=x86_64`），
          # 用户已决定放弃 macOS x86_64（不再 lipo 出 universal2）。
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: true
      - name: Build arm64 binary
        run: |
          cargo build --release -p rust-tunnel-client-gui --target aarch64-apple-darwin
      - name: Bundle .app and dmg
        env:
          VERSION: ${{ github.ref_name }}
          GUI_BIN: target/aarch64-apple-darwin/release/rust-tunnel-client-gui
        run: |
          bash scripts/bundle-macos.sh
          ls -lh dist/
      - name: Upload dmg
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.ssh"
          KEY="${HOME}/.ssh/rt_deploy_key"
          printf '%s\n' "${SSH_KEY}" > "${KEY}"
          chmod 600 "${KEY}"
          PORT="${SSH_PORT:-22}"
          DEST="${DEPLOY_PATH}/client/${GITHUB_REF_NAME}"
          DMG="dist/RustTunnel-${GITHUB_REF_NAME}-macos-aarch64.dmg"
          SSH_OPTS=(-i "${KEY}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR)
          ssh "${SSH_OPTS[@]}" -p "${PORT}" "${SSH_USER}@${SSH_HOST}" "mkdir -p '${DEST}'"
          scp "${SSH_OPTS[@]}" -P "${PORT}" "$DMG" "${SSH_USER}@${SSH_HOST}:${DEST}/"
          rm -f "${KEY}"

  finalize-client:
    needs: [build-client, build-gui, build-gui-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checksum, permissions and latest symlink
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            BASE="${{ secrets.DEPLOY_PATH }}/client"
            TAG="${{ github.ref_name }}"
            cd "${BASE}/${TAG}"
            chmod +x rust-tunnel-client-* RustTunnel-*.dmg 2>/dev/null || true
            sha256sum rust-tunnel-client-* RustTunnel-*.dmg 2>/dev/null > SHA256SUMS || sha256sum rust-tunnel-client-* > SHA256SUMS
            echo "--- ${BASE}/${TAG} ---"
            ls -lh
            echo "--- SHA256SUMS ---"
            cat SHA256SUMS
            ln -sfn "${TAG}" "${BASE}/latest"
            ls -ld "${BASE}/latest"
            echo "Client ${TAG} deployed successfully to ${BASE}/${TAG}/ (latest -> ${TAG})"
