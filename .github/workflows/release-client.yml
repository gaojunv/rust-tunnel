name: Release Client (CLI)

# 客户端 **CLI** 二进制发布（Linux musl / macOS x86_64 / macOS aarch64 / Windows MSVC）。
# GUI 客户端（Windows GNU + macOS arm64 dmg + 无人值守服务 exe + Windows 单包 zip）
# 在独立的 release-client-gui.yml（tag `gui-v*`）里构建，两个 workflow 各自独立触发。
#
# 当推送 `v*` tag 时触发，也可以手动触发：各 runner 直接 SCP 到服务器的
# ${DEPLOY_PATH}/client/<version>/ 目录（版本隔离），不使用 Artifact 中转，避免存储配额问题。
# 全部平台上传完成后由 finalize-client 在服务端**合并**校验和并更新 latest 软链接。
# `latest` 只由本 workflow 维护（它代表「包含完整 CLI 产物的最新版本」），
# GUI 流程刻意不碰它——见 release-client-gui.yml。
# 行为对齐 release-server.yml（SCP 直传，不依赖 Releases/Artifacts 分发）
#
# 版本目录名不需要任何人手填（见 scripts/resolve-release-version.sh）：tag 触发时取 tag，
# 手动触发时取 `crates/client/Cargo.toml` 的 version —— 客户端上报给服务端做版本门控的
# `CARGO_PKG_VERSION` 就是它，发布目录名照它推出来才不会自相矛盾。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '归档目录名（留空 = 取 crates/client/Cargo.toml 的版本，如 v0.17.0）'
        required: false
        type: string

# 最小权限：仅需 checkout 拉代码；缓存用 runtime token，上传走 SCP/SSH 密钥，均不依赖 GITHUB_TOKEN
permissions:
  contents: read

jobs:
  # 版本目录名只算一次，build 与 finalize 共用 —— 两处各算一遍迟早会算出不一样的结果。
  # 解析规则（含「tag 与清单版本不一致就拒绝发布」的理由）见 scripts/resolve-release-version.sh。
  version:
    runs-on: ubuntu-latest
    outputs:
      dir: ${{ steps.resolve.outputs.dir }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve archive version
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          bash scripts/resolve-release-version.sh \
            --manifest crates/client/Cargo.toml \
            --input "${INPUT_VERSION}"

  build-client:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: rust-tunnel-client
            asset: rust-tunnel-client-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: rust-tunnel-client
            asset: rust-tunnel-client-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: rust-tunnel-client
            asset: rust-tunnel-client-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: rust-tunnel-client.exe
            asset: rust-tunnel-client-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust with target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: true

      - name: Install musl tools (Linux only)
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: musl-tools
          version: 1.0

      - name: Build client
        env:
          RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release -p rust-tunnel-client --target ${{ matrix.target }}

      - name: Strip binary (non-Windows)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/${{ matrix.binary }}

      # 各平台自行 SCP 直传：appleboy/scp-action 是 Docker action，只能跑在 Linux runner，
      # 因此这里统一用原生 ssh/scp（Windows runner 走 git-bash，自带 OpenSSH 客户端）
      - name: Upload binary to remote server
        shell: bash
        env:
          VER: ${{ needs.version.outputs.dir }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.ssh"
          KEY="${HOME}/.ssh/rt_deploy_key"
          printf '%s\n' "${SSH_KEY}" > "${KEY}"
          chmod 600 "${KEY}"
          PORT="${SSH_PORT:-22}"
          DEST="${DEPLOY_PATH}/client/${VER}"
          SSH_OPTS=(-i "${KEY}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR)
          echo "Uploading ${{ matrix.asset }} -> ${DEST}/"
          ssh "${SSH_OPTS[@]}" -p "${PORT}" "${SSH_USER}@${SSH_HOST}" "mkdir -p '${DEST}'"
          scp "${SSH_OPTS[@]}" -P "${PORT}" \
            "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            "${SSH_USER}@${SSH_HOST}:${DEST}/${{ matrix.asset }}"
          rm -f "${KEY}"

  finalize-client:
    needs: [version, build-client]
    runs-on: ubuntu-latest
    steps:
      - name: Checksum, permissions and latest symlink
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            BASE="${{ secrets.DEPLOY_PATH }}/client"
            TAG="${{ needs.version.outputs.dir }}"
            cd "${BASE}/${TAG}"

            # 合并式清单：CLI 与 GUI 是两个独立 workflow，可能同时发布同一个版本目录
            # （协议不兼容版本要求两个 tag 指向同一版本，例如 v0.13.2 + gui-v0.13.2）。
            # 每次都整份重写会抹掉对方刚写进去的条目，所以先保留「不归本流程管」的旧行，
            # 再追加本次产物的新行，最后按文件名（第二列）排序。
            # 本流程负责：rust-tunnel-client-linux-* / -macos-* / -windows-x86_64.exe；
            # GUI 流程负责：rust-tunnel-client-gui-* / -service-* / RustTunnel-*.dmg。
            #
            # 注意：未匹配的 glob 在 set -e 下会让 sha256sum 报错，故逐个判断文件存在性；
            # 同一个循环顺带补上 CLI 二进制的执行位。
            TMP="$(mktemp)"
            if [ -f SHA256SUMS ]; then
              grep -Ev '[ *](rust-tunnel-client-linux-[^ ]*|rust-tunnel-client-macos-[^ ]*|rust-tunnel-client-windows-x86_64\.exe)$' \
                SHA256SUMS > "${TMP}" || true
            else
              : > "${TMP}"
            fi
            for f in rust-tunnel-client-linux-* rust-tunnel-client-macos-* rust-tunnel-client-windows-x86_64.exe; do
              [ -f "$f" ] || continue
              chmod +x "$f"
              sha256sum "$f" >> "${TMP}"
            done
            sort -k2 "${TMP}" > SHA256SUMS
            rm -f "${TMP}"

            echo "--- ${BASE}/${TAG} ---"
            ls -lh
            echo "--- SHA256SUMS ---"
            cat SHA256SUMS
            ln -sfn "${TAG}" "${BASE}/latest"
            ls -ld "${BASE}/latest"
            echo "Client CLI ${TAG} deployed successfully to ${BASE}/${TAG}/ (latest -> ${TAG})"
