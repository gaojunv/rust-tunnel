name: Release Server to Remote Server

# 当推送 tag 时触发，也可以手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Copy frontend dist
        run: |
          cp -r frontend/dist ./frontend-dist

      - name: Install Rust with musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build server (static linking with musl)
        run: |
          cargo build --release --bin rust-tunnel-server --target x86_64-unknown-linux-musl
          strip target/x86_64-unknown-linux-musl/release/rust-tunnel-server

      - name: Copy binary to root directory for upload
        run: |
          cp target/x86_64-unknown-linux-musl/release/rust-tunnel-server ./

      - name: Generate config from template
        run: |
          sed \
            -e "s|\${ADMIN_PASSWORD}|${{ secrets.ADMIN_PASSWORD }}|g" \
            -e "s|\${CLIENT_AUTH_TOKEN}|${{ secrets.CLIENT_AUTH_TOKEN }}|g" \
            -e "s|\${SS_PASSWORD}|${{ secrets.SS_PASSWORD }}|g" \
            contrib/config.toml.template > config.toml

      - name: Deploy files to remote server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "./rust-tunnel-server,./contrib/rust-tunnel-server.service,./config.toml"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Install config, service and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            # 安装配置文件
            sudo mkdir -p /etc/rust-tunnel
            sudo cp ${{ secrets.DEPLOY_PATH }}/config.toml /etc/rust-tunnel/config.toml

            # 安装 systemd service 文件
            sudo cp ${{ secrets.DEPLOY_PATH }}/contrib/rust-tunnel-server.service /etc/systemd/system/rust-tunnel-server.service
            sudo systemctl daemon-reload

            # 重启服务
            sudo systemctl restart rust-tunnel-server
