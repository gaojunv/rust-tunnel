name: Release Server

# 当推送 tag 时触发，也可以手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules and npm
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  build-server:
    needs: [build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist/

      - name: Install Rust with musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: true

      - name: Install musl tools
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: musl-tools
          version: 1.0

      - name: Build server (static linking with musl)
        run: |
          cargo build --release --bin rust-tunnel-server --target x86_64-unknown-linux-musl --features embed-frontend
          strip target/x86_64-unknown-linux-musl/release/rust-tunnel-server

      - name: Upload server binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-tunnel-server
          path: target/x86_64-unknown-linux-musl/release/rust-tunnel-server

  deploy:
    needs: [build-server]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: rust-tunnel-server
          path: ./

      - name: Make binary executable
        run: chmod +x ./rust-tunnel-server

      - name: Generate config from template
        run: |
          sed \
            -e "s|\${ADMIN_PASSWORD}|${{ secrets.ADMIN_PASSWORD }}|g" \
            -e "s|\${CLIENT_AUTH_TOKEN}|${{ secrets.CLIENT_AUTH_TOKEN }}|g" \
            -e "s|\${SS_PASSWORD}|${{ secrets.SS_PASSWORD }}|g" \
            -e "s|\${TROJAN_PASSWORD}|${{ secrets.TROJAN_PASSWORD }}|g" \
            contrib/config.toml.template > config.toml

      - name: Deploy files to remote server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "./rust-tunnel-server,./contrib/rust-tunnel-server.service,./config.toml"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Install config, service and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            # 安装配置文件
            sudo mkdir -p /etc/rust-tunnel
            sudo cp ${{ secrets.DEPLOY_PATH }}/config.toml /etc/rust-tunnel/config.toml

            # 安装 systemd service 文件
            sudo cp ${{ secrets.DEPLOY_PATH }}/contrib/rust-tunnel-server.service /etc/systemd/system/rust-tunnel-server.service
            sudo systemctl daemon-reload

            # 重启服务
            sudo systemctl restart rust-tunnel-server
