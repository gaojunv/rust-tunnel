name: Deploy Server

# 单 job 构建 + 部署：不使用 Artifact，避免存储配额问题
# 手动触发；如需 tag 触发可取消下方注释（注意与 release-server.yml 的 tag 触发会重复部署）
on:
  workflow_dispatch:
  # push:
  #   tags:
  #     - 'v*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # ---------- 前端 ----------
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Cache node_modules and npm
        uses: actions/cache@v6
        with:
          path: |
            frontend/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build frontend and stage for embedding
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          rm -rf frontend-dist
          cp -r frontend/dist frontend-dist

      # ---------- 后端 ----------
      - name: Install Rust with musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: true

      - name: Install musl tools
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: musl-tools
          version: 1.0

      - name: Build server (static linking with musl)
        run: |
          cargo build --release -p rust-tunnel-server --target x86_64-unknown-linux-musl --features rag,embed-frontend
          strip target/x86_64-unknown-linux-musl/release/rust-tunnel-server
          cp target/x86_64-unknown-linux-musl/release/rust-tunnel-server ./rust-tunnel-server

      # ---------- 部署 ----------
      - name: Generate config from template
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # DEPLOY_PATH 缺失时 client_dist_dir 会静默变成 "/client"（占位符校验放行），
          # 下载页就永远空着 —— 先挡住
          if [ -z "${DEPLOY_PATH}" ]; then
            echo "::error::secrets.DEPLOY_PATH is empty"
            exit 1
          fi
          sed \
            -e "s|\${ADMIN_PASSWORD}|${{ secrets.ADMIN_PASSWORD }}|g" \
            -e "s|\${CLIENT_AUTH_TOKEN}|${{ secrets.CLIENT_AUTH_TOKEN }}|g" \
            -e "s|\${SS_PASSWORD}|${{ secrets.SS_PASSWORD }}|g" \
            -e "s|\${TROJAN_PASSWORD}|${{ secrets.SS_PASSWORD }}|g" \
            -e "s|\${CLIENT_DIST_DIR}|${DEPLOY_PATH%/}/client|g" \
            -e "s|\${WIKI_DIST_DIR}|${DEPLOY_PATH%/}/wiki|g" \
            contrib/config.toml.template > config.toml
          # 校验占位符已全部替换（漏替换会让服务端读到字面量，静默跑错配置）
          if grep -nE '\$\{(ADMIN_PASSWORD|CLIENT_AUTH_TOKEN|SS_PASSWORD|TROJAN_PASSWORD|CLIENT_DIST_DIR|WIKI_DIST_DIR)\}' config.toml; then
            echo "::error::config.toml still contains unresolved placeholders (check repo secrets)"
            exit 1
          fi
          echo "--- client_dist_dir ---"
          grep client_dist_dir config.toml
          echo "--- wiki_dist_dir ---"
          grep wiki_dist_dir config.toml

      - name: Deploy files to remote server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "./rust-tunnel-server,./contrib/rust-tunnel-server.service,./config.toml"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Install config, service and restart
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            # 安装配置文件
            sudo mkdir -p /etc/rust-tunnel
            sudo cp ${{ secrets.DEPLOY_PATH }}/config.toml /etc/rust-tunnel/config.toml

            # 安装 systemd service 文件
            sudo cp ${{ secrets.DEPLOY_PATH }}/contrib/rust-tunnel-server.service /etc/systemd/system/rust-tunnel-server.service
            sudo systemctl daemon-reload

            # 重启服务
            sudo systemctl restart rust-tunnel-server
