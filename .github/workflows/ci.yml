name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (tests only)
        # Suppress 18 pre-existing src/ warnings (deferred to cleanup PR).
        # Scope: -A flags for known categories; --tests compiles lib as dependency.
        run: >-
          cargo clippy --tests -- -D warnings
          -A clippy::collapsible_match
          -A clippy::map_flatten
          -A clippy::new_without_default
          -A clippy::needless_borrows_for_generic_args
          -A clippy::needless_borrow
          -A clippy::io_other_error
          -A clippy::bool_assert_comparison
          -A clippy::zombie_processes

      - name: Build
        run: cargo build --tests

      - name: Test
        run: cargo test --tests -- --test-threads=4
        env:
          RUST_BACKTRACE: "1"
