name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install mold linker
        # .cargo/config.toml 通过 -fuse-ld=mold 指定 mold 链接器，加速 1G+ 测试二进制链接
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      # 批次 9 门禁形态演进：原 `-D warnings -A <8 类存量抑制>` 在批次 0 引入
      # pedantic warn 基线后已失真（存量警告类别完全变化，该步骤在 main 上持续红）。
      # 现形态：workspace.lints.clippy 中 unwrap_used/expect_used/panic = deny，
      # cargo clippy 本身即硬门禁（违反 deny lint → 非零退出）；其余 pedantic 存量
      # 仍 warn（台账 docs/lint-baseline.md），随批次 9 后续收敛后恢复 -D warnings。
      - name: Clippy（panic 风险 deny 门禁，默认组合）
        run: cargo clippy --workspace --all-targets

      # rag 为非默认 feature：rag-gated 代码须显式开启才被 lint 覆盖
      - name: Clippy（rag 组合）
        run: cargo clippy --workspace --all-targets --features rust-tunnel-server/rag

      - name: Build
        run: cargo build --workspace --tests

      - name: Test
        run: cargo test --workspace --tests -- --test-threads=4
        env:
          RUST_BACKTRACE: "1"
