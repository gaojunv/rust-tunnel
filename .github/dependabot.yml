version: 2
updates:
  # Rust workspace（根 Cargo.toml 覆盖所有 crate）
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    # cargo 组只聚合 patch：本仓库大量核心依赖为 0.x（axum/rustls/sqlx/eframe…），
    # 其 minor 段变化即破坏性升级，进组必然编不过，让它们以独立 PR 显式出现。
    groups:
      rust-dependencies:
        patterns:
          - "*"
        update-types:
          - patch

  # 管理前端
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # eslint-plugin-react-refresh 0.5 要求 eslint ≥9，当前 eslint 8；
    # 待工具链整体升级（eslint 10 + typescript-eslint 8）后移除此忽略。
    ignore:
      - dependency-name: eslint-plugin-react-refresh
        versions:
          - "0.5.x"

  # Wiki 桌面端 UI
  - package-ecosystem: npm
    directory: /wiki-desktop-ui
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5

  # GitHub Actions 自身
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
