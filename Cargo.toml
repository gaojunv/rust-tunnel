[package]
name = "rust-tunnel"
version = "0.4.0"
edition = "2021"
description = "A simple intranet penetration tool with server and client"
license = "MIT OR Apache-2.0"

[workspace]
members = ["crates/agent", "crates/client", "crates/client-gui", "crates/common", "crates/llm", "crates/persistence", "crates/pki", "crates/protocols", "crates/rag", "crates/server", "crates/stats", "crates/wiki-core", "crates/wiki-serve"]

[workspace.lints.clippy]
# 企业级 lint 基线：pedantic 组已在批次 9/10 全仓清零，转 deny 硬门禁。
# 新增违反必须就地修正，或加 `#[expect(lint, reason = "中文理由")]` 显式豁免。
pedantic = { level = "deny", priority = -1 }
# doc_markdown 对中文注释误报率极高（863 条），自动修复会破坏中文文档
doc_markdown = "allow"
# panic 风险关键项（restriction 组）：生产代码 deny 硬门禁，测试经各 crate
# lib.rs 头部 `#![cfg_attr(test, allow(...))]` 豁免；构造期 fatal 用语句级
# `#[expect(...)]` 豁免（lint 不再触发时编译器会提醒移除）。根元包（e2e
# tests/）无 `[lints] workspace = true`，天然不受此约束。
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# 正确性兜底（默认 warn 提升为 deny，无存量风险）
unwrap_in_result = "deny"

[workspace.lints.rust]
# 全部 pub API 文档已在批次 9e/10 补齐，转 deny 防回退
missing_docs = "deny"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs", "process", "signal"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
clap = { version = "4.0", features = ["derive"] }
bytes = "1.0"
tokio-util = { version = "0.7", features = ["time"] }
rand = "0.8"
get_if_addrs = "0.5.3"
axum = { version = "0.7", features = ["json", "multipart", "ws"] }
axum-extra = { version = "0.9", features = ["query"] }
tower-http = { version = "0.5", features = ["cors", "fs", "compression-gzip", "compression-br"] }
async-stream = "0.3"
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio", "http1", "http2", "server", "server-auto"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "native-tokio", "ring", "rustls-native-certs"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# 嵌入前端资源（服务端 `embed-frontend` feature）
rust-embed = { version = "8.0", features = ["axum"] }
mime_guess = "2.0"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
qdrant-edge = { version = "=0.7.2" }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "macros"] }
gethostname = "0.4"
# PTY for the agent terminal loopback service (wezterm-maintained, Unix/ConPTY)
portable-pty = "0.9"
toml = "0.8"
figment = { version = "0.10", features = ["env", "toml"] }
arc-swap = "1.7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2.2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = "0.14"
webpki-roots = "1.0"
rustls-native-certs = "0.8"
time = "0.3"
shadowsocks = { version = "1.24", default-features = false, features = ["aead-cipher", "aead-cipher-extra"] }
md-5 = "0.10"
# PDF 文本层提取（纯 Rust，无系统动态库依赖；nom_parser 提供 load/extract_text）
lopdf = { version = "0.32", default-features = false, features = ["nom_parser"] }
# OOXML（docx/xlsx/pptx）解包：仅 deflate（miniz_oxide 纯 Rust），不开 bzip2/zstd/aes
zip = { version = "0.6", default-features = false, features = ["deflate"] }
# OOXML XML 部件解析；escape-html 提供文本实体的 unescape
quick-xml = { version = "0.31", features = ["escape-html"] }
similar = "2"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
aes-gcm = "0.10"
hickory-proto = "0.26"
async-trait = "0.1"
futures-util = "0.3"
instant-acme = { version = "0.8", default-features = false, features = ["hyper-rustls", "ring"] }
x509-parser = "0.16"
base64 = "0.22"
urlencoding = "2.1"
hickory-resolver = "0.26"
# ACP 协议 crate：unstable_elicitation 提供 AskUserQuestion 表单（elicitation/create）
# 的类型与路由。只开这一个 unstable feature，不开全量 unstable（避免 mcp/auth 等
# 无关不稳定类型）。旧版 claude-code-acp 不识别该 capability，行为与现状一致。
agent-client-protocol = { version = "2", features = ["unstable_elicitation"] }
libc = "0.2"
tower = { version = "0.5", features = ["util"] }
tempfile = "3.0"

# ── 桌面笔记骨架（wiki-core / wiki-serve）──────────────────────────
# 仅这两个 crate 使用；未挂到根 package 的 dependencies，故不影响既有
# `cargo build` / `cargo test` 的编译面。
comrak = "0.54"
tantivy = "0.26"
gray_matter = "0.3"
walkdir = "2.5"
petgraph = "0.6"

[features]
# rag 默认开启：集成测试 tests/rag_multiformat.rs 用根 crate 的
# #![cfg(feature = "rag")]，仅声明不设 default 时该 cfg 为 false、测试被整体
# cfg 掉（dev-dep 的 rag 不传导为根包自身 feature）。根包无 lib/bin，
# default 仅影响测试编译与 dev-deps，无副作用。
default = ["rag"]
rag = ["rust-tunnel-server/rag"]

[dependencies]

[dev-dependencies]
rust-tunnel-common = { path = "crates/common" }
rust-tunnel-client = { path = "crates/client" }
rust-tunnel-server = { path = "crates/server", features = ["rag"] }
rust-tunnel-protocols = { path = "crates/protocols" }
tokio.workspace = true
serde_json.workspace = true
tracing.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rcgen.workspace = true
tower.workspace = true
tempfile.workspace = true
reqwest.workspace = true
futures-util.workspace = true
shadowsocks.workspace = true
axum.workspace = true
uuid.workspace = true
zip.workspace = true

[profile.test]
debug = 1
opt-level = 1
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = 1
