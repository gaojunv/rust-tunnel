[package]
name = "rust-tunnel"
version = "0.4.0"
edition = "2021"
description = "A simple intranet penetration tool with server and client"
license = "MIT"

[workspace]
members = ["crates/common", "crates/client", "crates/server"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
clap = { version = "4.0", features = ["derive"] }
bytes = "1.0"
tokio-util = { version = "0.7", features = ["time"] }
rand = "0.8"
get_if_addrs = "0.5.3"
axum = { version = "0.7", features = ["json", "multipart", "ws"] }
axum-extra = { version = "0.9", features = ["query"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
async-stream = "0.3"
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio", "http1", "http2", "server", "server-auto"] }
hyper-rustls = { version = "0.26", default-features = false, features = ["http1", "http2", "native-tokio", "ring", "rustls-native-certs"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# 嵌入前端资源（服务端 `embed-frontend` feature）
rust-embed = { version = "8.0", features = ["axum"] }
mime_guess = "2.0"
jsonwebtoken = "9.0"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
qdrant-edge = { version = "=0.7.2" }
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono", "macros"] }
gethostname = "0.4"
# PTY for the agent terminal loopback service (wezterm-maintained, Unix/ConPTY)
portable-pty = "0.9"
toml = "0.8"
figment = { version = "0.10", features = ["env", "toml"] }
arc-swap = "1.7"
rustls = "0.22"
rustls-pemfile = "2.0"
tokio-rustls = "0.25"
rcgen = "0.14"
webpki-roots = "0.26"
rustls-native-certs = "0.7"
time = "0.3"
shadowsocks = { version = "1.24", default-features = false, features = ["aead-cipher", "aead-cipher-extra"] }
md-5 = "0.10"
# PDF 文本层提取（纯 Rust，无系统动态库依赖；nom_parser 提供 load/extract_text）
lopdf = { version = "0.32", default-features = false, features = ["nom_parser"] }
# OOXML（docx/xlsx/pptx）解包：仅 deflate（miniz_oxide 纯 Rust），不开 bzip2/zstd/aes
zip = { version = "0.6", default-features = false, features = ["deflate"] }
# OOXML XML 部件解析；escape-html 提供文本实体的 unescape
quick-xml = { version = "0.31", features = ["escape-html"] }
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
aes-gcm = "0.10"
hickory-proto = "0.24"
async-trait = "0.1"
futures-util = "0.3"
instant-acme = { version = "0.8", default-features = false, features = ["hyper-rustls", "ring"] }
x509-parser = "0.16"
base64 = "0.22"
urlencoding = "2.1"
trust-dns-resolver = "0.23"
agent-client-protocol = "2"
libc = "0.2"
tower = { version = "0.5", features = ["util"] }
tempfile = "3.0"

[features]
# rag 默认开启：集成测试 tests/rag_multiformat.rs 用根 crate 的
# #![cfg(feature = "rag")]，仅声明不设 default 时该 cfg 为 false、测试被整体
# cfg 掉（dev-dep 的 rag 不传导为根包自身 feature）。根包无 lib/bin，
# default 仅影响测试编译与 dev-deps，无副作用。
default = ["rag"]
rag = ["rust-tunnel-server/rag"]

[dependencies]

[dev-dependencies]
rust-tunnel-common = { path = "crates/common" }
rust-tunnel-client = { path = "crates/client" }
rust-tunnel-server = { path = "crates/server", features = ["rag"] }
tokio.workspace = true
serde_json.workspace = true
tracing.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rcgen.workspace = true
tower.workspace = true
tempfile.workspace = true
reqwest.workspace = true
futures-util.workspace = true
shadowsocks.workspace = true
axum.workspace = true
uuid.workspace = true
zip.workspace = true

[profile.test]
debug = 1
opt-level = 1
incremental = false

[profile.dev]
opt-level = 0
debug = 1
