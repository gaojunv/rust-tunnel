[package]
name = "rust-tunnel"
version = "0.1.0"
edition = "2021"
description = "A simple intranet penetration tool with server and client"
license = "MIT"

[[bin]]
name = "rust-tunnel-server"
path = "src/bin/server.rs"

[[bin]]
name = "rust-tunnel-client"
path = "src/bin/client.rs"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization for control messages
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Command line argument parsing
clap = { version = "4.0", features = ["derive"] }

# Byte handling
bytes = "1.0"

# Timeout utilities
tokio-util = { version = "0.7", features = ["time"] }

# Random generation for connection IDs
rand = "0.8"

# Get network interface addresses for workaround
get_if_addrs = "0.5.3"

# Web framework
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
async-stream = "0.3"

# HTTP client and utilities for reverse proxy
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Embed frontend assets
rust-embed = { version = "8.0", features = ["axum"], optional = true }
mime_guess = "2.0"

# Authentication
jsonwebtoken = "9.0"

# Time and serialization
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono", "macros"] }

# Get hostname
gethostname = "0.4"

# Configuration file support
toml = "0.8"
figment = { version = "0.10", features = ["env", "toml"] }

# TLS support
rustls = "0.22"
rustls-pemfile = "2.0"
tokio-rustls = "0.25"
rcgen = "0.12"
webpki-roots = "0.26"
rustls-native-certs = "0.7"
time = "0.3"
shadowsocks = { version = "1.24", default-features = false, features = ["aead-cipher", "aead-cipher-extra"] }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

# DNS protocol types
hickory-proto = "0.24"

# ACME protocol support
instant-acme = "0.7"

[features]
embed-frontend = ["rust-embed"]

[dev-dependencies]
tempfile = "3.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
