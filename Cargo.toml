[package]
name = "rust-tunnel"
version = "0.1.0"
edition = "2021"
description = "A simple intranet penetration tool with server and client"
license = "MIT"

[[bin]]
name = "rust-tunnel-server"
path = "src/bin/server.rs"

[[bin]]
name = "rust-tunnel-client"
path = "src/bin/client.rs"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization for control messages
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Command line argument parsing
clap = { version = "4.0", features = ["derive"] }

# Byte handling
bytes = "1.0"

# Timeout utilities
tokio-util = { version = "0.7", features = ["time"] }

# Random generation for connection IDs
rand = "0.8"
